version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: template-gestion-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template_gestion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Aplicación Next.js (Desarrollo)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: template-gestion-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/template_gestion
      - NEXTAUTH_SECRET=desarrollo-local-secret-cambiar-en-produccion
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      # Mount del código para hot-reload
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    command: sh -c "npx prisma db push && npm run dev"

  # Prisma Studio (Opcional - para ver la BD)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: template-gestion-prisma-studio
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/template_gestion
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    command: npx prisma studio --port 5555 --hostname 0.0.0.0
    profiles:
      - studio

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
